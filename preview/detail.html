<!doctype html>
<!--
    Preview: detail page of a movie (backdrop, glass buttons, cast).
    Recreates Jellyfin with the same CSS classes.
-->
<html lang="en" class="layout-desktop">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jellyos – Detail page</title>
    <link rel="stylesheet" href="preview.css">
    <link rel="stylesheet" href="../theme/apple-tv.css">
</head>
<body>
<div class="backgroundContainer"></div>

<header class="skinHeader">
    <div class="headerTop">
        <div class="headerLeft">
            <button class="headerButton headerBackButton" title="Back"><span data-icon="arrow_back"></span></button>
        </div>
        <div class="headerRight">
            <button class="headerButton headerCastButton" title="Play on"><span data-icon="cast"></span></button>
            <button class="headerButton headerSearchButton" title="Search"><span data-icon="search"></span></button>
            <button class="headerButton headerUserButton" title="User"><span data-icon="person"></span></button>
        </div>
    </div>
</header>

<div class="page libraryPage itemDetailPage selfBackdropPage">
    <div class="itemBackdrop" style="background-image:url(assets/mountains.svg)"></div>

    <div class="detailPageWrapperContainer">
        <div class="detailPagePrimaryContainer">
            <div class="detailRibbon">
                <div class="infoWrapper">
                    <div class="nameContainer">
                        <h1 class="itemName infoText parentNameLast">The Last Frontier</h1>
                    </div>
                    <div class="itemMiscInfo itemMiscInfo-primary">
                        <span>2024</span><span>2 hr 8 min</span><span>PG-13</span><span>★ 7.9</span>
                    </div>
                    <div class="itemMiscInfo itemMiscInfo-secondary">
                        <span>Adventure, Drama</span>
                    </div>
                </div>
                <div class="mainDetailButtons">
                    <button class="emby-button button-flat detailButton btnPlay" title="Play"><span data-icon="play_arrow"></span></button>
                    <button class="emby-button button-flat detailButton" title="Played"><span data-icon="check"></span></button>
                    <button class="emby-button button-flat detailButton" title="Favorite"><span data-icon="favorite_border"></span></button>
                    <button class="emby-button button-flat detailButton" title="More"><span data-icon="more_horiz"></span></button>
                </div>
            </div>
        </div>

        <div class="detailPageSecondaryContainer">
            <p class="overview">
                A mountaineer sets out to climb the last unconquered face of the range
                while a storm is gathering. Placeholder text for the preview.
            </p>

            <div class="verticalSection">
                <h2 class="sectionTitle sectionTitle-cards">Cast &amp; Crew</h2>
                <div class="itemsContainer" id="castContent"></div>
            </div>

            <div class="verticalSection">
                <h2 class="sectionTitle sectionTitle-cards">More Like This</h2>
                <div class="itemsContainer" id="rowSimilar"></div>
            </div>
        </div>
    </div>
</div>

<script src="preview.js"></script>
<script>
    row("castContent", [
        ["Mara Ellison", "Lena"], ["Jonas Brink", "Theo"], ["Ada Novak", "Iris"],
        ["Kian Herzog", "Mountain Guide"], ["Selma Vogt", "Director"], ["Tom Reiter", "Cinematography"]
    ].map(([title, info], i) => ({ title, info, index: i + 2 })));

    row("rowSimilar", [
        "Summit Storm", "The White Silence", "North Face", "Above the Clouds",
        "Ice Wind", "The Long Descent", "Altitude"
    ].map((title, i) => ({ title, info: String(2016 + i), index: i + 3 })));

    insertIcons();
</script>
</body>
</html>
